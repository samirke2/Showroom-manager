name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# هذا المتغير يحل مشكلة تحذير Node.js 20 (Deprecation Warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout repository
      uses: actions/checkout@v4
      # ملاحظة: إذا توفر إصدار أحدث مثل v6، يفضل استخدامه لتجنب التحذيرات

    # 2. إعداد بيئة Java (مطلوبة لبناء تطبيقات الأندرويد)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. إعداد Python (كما ظهر في تحذيراتك، قد يحتاجه المشروع لأدوات مساعدة)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 4. إعداد ccache (كما ظهر في تحذيراتك، لتسريع البناء)
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.3
      # تم التحديث من v1.2 إلى v1.3 لتجنب التحذيرات

    # 5. إعطاء صلاحية التنفيذ لملف gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      # ملاحظة هامة: إذا كان مشروع الأندرويد داخل مجلد فرعي (مثل React Native أو Flutter)، 
      # يجب تغيير المسار إلى: chmod +x ./android/gradlew

    # 6. أمر البناء النهائي
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      # ملاحظة: إذا كان المشروع في مجلد فرعي، غير الأمر إلى: ./android/gradlew assembleDebug
      # يمكنك تغيير assembleDebug إلى bundleRelease إذا كنت تريد بناء نسخة للإصدار
