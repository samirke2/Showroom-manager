name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in main.py buildozer.spec icon.png splash.png Sahel.ttf manifest_app_extra.xml xml/file_paths.xml; do
            if [ ! -f "$f" ]; then echo "::error::Missing file: $f"; exit 1; fi
          done
          python3 -m py_compile main.py
          grep -q "request_android_permissions" main.py || { echo "::error::main.py is not the patched version"; exit 1; }
          grep -q "androidx.core" buildozer.spec && grep -q "^requirements.*androidx" buildozer.spec && { echo "::error::remove androidx.core from requirements"; exit 1; } || true
          echo "All files OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev libltdl-dev build-essential ccache

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv "setuptools<70" wheel

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Pre-download Python sources (python.org blocks 403)
        run: |
          set -e
          for V in 3.10.10 3.10.11; do
            F="Python-$V.tgz"
            ok=0
            for URL in \
              "https://www.python.org/ftp/python/$V/$F" \
              "https://mirrors.huaweicloud.com/python/$V/$F" \
              "https://registry.npmmirror.com/-/binary/python/$V/$F" \
              "https://mirrors.aliyun.com/python-release/source/$F"; do
              echo "Trying $URL"
              if curl -fL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64)" -o "/tmp/$F" "$URL" && tar -tzf "/tmp/$F" >/dev/null 2>&1; then
                ok=1; echo "OK: $URL"; break
              fi
            done
            if [ "$ok" = "1" ]; then
              for ARCH in arm64-v8a armeabi-v7a; do
                for R in python3 hostpython3; do
                  D=".buildozer/android/platform/build-$ARCH/packages/$R"
                  mkdir -p "$D"
                  cp "/tmp/$F" "$D/$F"
                  touch "$D/.mark-$F"
                done
              done
            else
              echo "::warning::could not download $F"
            fi
          done
          ls -R .buildozer/android/platform/build-arm64-v8a/packages | head -20

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== AROUND FIRST TRACEBACK ====="
          L=$(grep -n "Traceback" build.log | head -1 | cut -d: -f1)
          if [ -n "$L" ]; then S=$((L>40 ? L-40 : 1)); sed -n "${S},$((L+45))p" build.log; fi
          echo "===== DOWNLOADS ====="
          grep -n -i "download" build.log | tail -n 15 || true
          echo "===== ERROR LINES ====="
          grep -nE "ERROR|Error:|error:|FAILED|Traceback|No module|No matching|Exception|not found" build.log | tail -n 40 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samirpythdz-apk
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
