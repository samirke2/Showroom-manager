name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. إعداد Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. تثبيت مكتبات النظام اللازمة (ضرورية لتجميع cryptography و reportlab و pillow)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev

    # 4. تثبيت وتحديث buildozer و cython
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython

    # 5. حذف أي كاش قديم قسرياً لضمان بناء نظيف
    - name: Clean old Buildozer caches
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    # 6. بناء التطبيق
    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    # 7. رفع ملف APK لتحميله
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk