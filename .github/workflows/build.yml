name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # الترقية إلى v4 لتجنب حزمة 'tools' المحذوفة
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    # قبول تراخيص SDK بشكل غير تفاعلي (لتجنب سؤال y/N)
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    # خطوة اختيارية: إعداد Python إذا كان مشروعك يحتاجه
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # خطوة اختيارية: إعداد ccache لتسريع البناء
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ github.job }}-${{ runner.os }}

    # منح صلاحية التنفيذ لملف gradlew
    # ⚠️ إذا كان مشروعك React Native أو Flutter، غير المسار إلى ./android/gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # أمر البناء النهائي
    # ⚠️ إذا كان مشروعك React Native أو Flutter، غير الأمر إلى ./android/gradlew assembleDebug
    - name: Build with Gradle
      run: ./gradlew assembleDebug
