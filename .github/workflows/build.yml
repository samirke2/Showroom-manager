name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev ccache curl
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv
    
    - name: Create custom reportlab recipe
      run: |
        mkdir -p custom_recipes/reportlab
        cat > custom_recipes/reportlab/__init__.py << 'EOF'
        from pythonforandroid.recipe import PythonRecipe


        class ReportLabRecipe(PythonRecipe):
            version = '3.6.13'
            url = 'https://files.pythonhosted.org/packages/source/r/reportlab/reportlab-{version}.tar.gz'
            depends = ['pillow', 'freetype']
            patches = []


        recipe = ReportLabRecipe()
        EOF
        echo "✅ Custom recipe created"
        cat custom_recipes/reportlab/__init__.py
    
    - name: Add p4a.local_recipes to [app] section
      run: |
        python3 << 'PYEOF'
        with open('buildozer.spec', 'r') as f:
            lines = f.readlines()
        
        # إزالة أي سطر قديم
        lines = [l for l in lines if not l.strip().startswith('p4a.local_recipes')]
        
        # إدراج السطر بعد requirements مباشرة (تحت [app])
        out = []
        inserted = False
        for line in lines:
            out.append(line)
            if line.startswith('requirements =') and not inserted:
                out.append('p4a.local_recipes = ./custom_recipes\n')
                inserted = True
        
        with open('buildozer.spec', 'w') as f:
            f.writelines(out)
        
        print("✅ Inserted:", inserted)
        PYEOF
        
        echo ""
        echo "═══════ buildozer.spec (relevant lines) ═══════"
        grep -nE "^\[|^requirements|^p4a\." buildozer.spec
    
    - name: Pre-download freetype and reportlab
      run: |
        set -e
        PKG_DIR=".buildozer/android/platform/build-arm64-v8a/packages"
        mkdir -p "$PKG_DIR/freetype" "$PKG_DIR/reportlab"
        
        # ═══ FREETYPE ═══
        echo "═══════ Downloading freetype ═══════"
        curl -4 -fL --retry 3 --connect-timeout 30 --max-time 300 \
          -o "$PKG_DIR/freetype/freetype-2.10.1.tar.gz" \
          "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz"
        
        SIZE=$(stat -c%s "$PKG_DIR/freetype/freetype-2.10.1.tar.gz")
        echo "Freetype size: $SIZE bytes"
        if ! tar -tzf "$PKG_DIR/freetype/freetype-2.10.1.tar.gz" >/dev/null 2>&1; then
          echo "❌ Freetype tarball invalid!"; exit 1
        fi
        touch "$PKG_DIR/freetype/.mark-freetype-2.10.1.tar.gz"
        echo "✅ Freetype OK"
        
        # ═══ REPORTLAB ═══ (اسم الملف يطابق وصفة p4a الأصلية)
        echo "═══════ Downloading reportlab ═══════"
        curl -4 -fL --retry 3 --connect-timeout 30 --max-time 300 \
          -o "$PKG_DIR/reportlab/fe660f227cac.tar.gz" \
          "https://files.pythonhosted.org/packages/source/r/reportlab/reportlab-3.6.13.tar.gz"
        
        SIZE=$(stat -c%s "$PKG_DIR/reportlab/fe660f227cac.tar.gz")
        echo "Reportlab size: $SIZE bytes"
        if ! tar -tzf "$PKG_DIR/reportlab/fe660f227cac.tar.gz" >/dev/null 2>&1; then
          echo "❌ Reportlab tarball invalid!"; exit 1
        fi
        # ننشئ ملفي العلامة (الاسم القديم والجديد) لضمان تخطي التحميل في كل الحالات
        touch "$PKG_DIR/reportlab/.mark-fe660f227cac.tar.gz"
        touch "$PKG_DIR/reportlab/.mark-reportlab-3.6.13.tar.gz"
        echo "✅ Reportlab OK"
        
        echo ""
        echo "═══════ Final verification ═══════"
        ls -lh "$PKG_DIR/freetype/"
        ls -lh "$PKG_DIR/reportlab/"
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-build
    
    - name: Build APK with Buildozer
      run: |
        export USE_CCACHE=1
        buildozer -v android debug
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: samir-pyth-dz-apk
        path: bin/*.apk
        retention-days: 30
