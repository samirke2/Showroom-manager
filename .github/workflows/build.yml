name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev ccache wget
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv
    
    - name: Pre-download problematic packages
      run: |
        PKG_DIR=".buildozer/android/platform/build-arm64-v8a/packages"
        mkdir -p "$PKG_DIR/freetype" "$PKG_DIR/reportlab"
        
        echo "=== Downloading freetype ==="
        wget -q --show-progress -O "$PKG_DIR/freetype/freetype-2.10.1.tar.gz" \
          "https://sourceforge.net/projects/freetype/files/latest/download?hem=aa3246e6d766f59feb8993c3bbcc460818ccef02e654e2ac8650fc1a04c10dc7"
        touch "$PKG_DIR/freetype/.mark-freetype-2.10.1.tar.gz"
        
        echo "=== Downloading reportlab ==="
        wget -q --show-progress -O "$PKG_DIR/reportlab/fe660f227cac.tar.gz" \
          "https://github.com/MrBitBucket/reportlab-mirror/archive/fe660f227cac.tar.gz" || \
        wget -q --show-progress -O "$PKG_DIR/reportlab/fe660f227cac.tar.gz" \
          "https://files.pythonhosted.org/packages/source/r/reportlab/reportlab-3.6.13.tar.gz"
        touch "$PKG_DIR/reportlab/.mark-fe660f227cac.tar.gz"
        
        echo "=== Verification ==="
        ls -lh "$PKG_DIR/freetype/"
        ls -lh "$PKG_DIR/reportlab/"
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-build
    
    - name: Build APK with Buildozer
      run: |
        export USE_CCACHE=1
        buildozer -v android debug
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: samir-pyth-dz-apk
        path: bin/*.apk
        retention-days: 30
