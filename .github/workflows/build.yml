name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    # ⭐ خطوة تشخيصية: طباعة الملفات لمعرفة مكان gradlew بالضبط
    - name: Verify Project Structure
      run: |
        echo "=== Current Directory ==="
        pwd
        echo "=== Files in Root ==="
        ls -la
        echo "=== Searching for gradlew ==="
        find . -name "gradlew" -type f

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ github.job }}-${{ runner.os }}

    # ⚠️ حل مشكلة المسار: إذا كان المشروع React Native أو Flutter، غيّر المسار إلى ./android/gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # ⚠️ حل مشكلة المسار: إذا كان المشروع React Native أو Flutter، غيّر الأمر إلى ./android/gradlew assembleDebug
    - name: Build with Gradle
      run: ./gradlew assembleDebug
