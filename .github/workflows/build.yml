name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev ccache curl
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36 virtualenv
    
    - name: Pre-download freetype and reportlab
      run: |
        set -e
        PKG_DIR=".buildozer/android/platform/build-arm64-v8a/packages"
        mkdir -p "$PKG_DIR/freetype" "$PKG_DIR/reportlab"
        
        # ═══ FREETYPE ═══
        echo "═══════ Downloading freetype ═══════"
        FT_TARGET="$PKG_DIR/freetype/freetype-2.10.1.tar.gz"
        curl -4 -fL --retry 3 --connect-timeout 30 --max-time 300 \
          -o "$FT_TARGET" \
          "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz"
        
        SIZE=$(stat -c%s "$FT_TARGET")
        echo "Freetype size: $SIZE bytes"
        if ! tar -tzf "$FT_TARGET" >/dev/null 2>&1; then
          echo "❌ Freetype tarball invalid!"; exit 1
        fi
        touch "$PKG_DIR/freetype/.mark-freetype-2.10.1.tar.gz"
        echo "✅ Freetype OK"
        
        # ═══ REPORTLAB ═══
        echo "═══════ Downloading reportlab ═══════"
        RL_TARGET="$PKG_DIR/reportlab/fe660f227cac.tar.gz"
        TMP_RL=$(mktemp -d)
        curl -4 -fL --retry 3 --connect-timeout 30 --max-time 300 \
          -o "$TMP_RL/reportlab-3.6.13.tar.gz" \
          "https://files.pythonhosted.org/packages/source/r/reportlab/reportlab-3.6.13.tar.gz"
        
        cd "$TMP_RL"
        tar -xzf reportlab-3.6.13.tar.gz
        mv reportlab-3.6.13 reportlab-fe660f227cac
        tar -czf "$OLDPWD/$RL_TARGET" reportlab-fe660f227cac
        cd "$OLDPWD"
        rm -rf "$TMP_RL"
        
        SIZE=$(stat -c%s "$RL_TARGET")
        echo "Reportlab size: $SIZE bytes"
        touch "$PKG_DIR/reportlab/.mark-fe660f227cac.tar.gz"
        echo "✅ Reportlab OK"
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-build
    
    - name: First run to fetch p4a
      run: |
        export USE_CCACHE=1
        timeout 180 buildozer -v android debug || true
        echo "=== p4a should now exist ==="
        ls -la .buildozer/android/platform/python-for-android/ || true
    
    - name: Apply ALL patches to p4a recipes with Python
      run: |
        python3 << 'PYEOF'
        import re, os

        P4A = ".buildozer/android/platform/python-for-android"
        
        # ═══════════════════════════════════════════════
        # 1. FREETYPE: تعديل URL
        # ═══════════════════════════════════════════════
        ft = f"{P4A}/pythonforandroid/recipes/freetype/__init__.py"
        if os.path.exists(ft):
            with open(ft) as f:
                c = f.read()
            c = c.replace(
                "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz",
                "https://downloads.sourceforge.net/project/freetype/freetype2/2.10.1/freetype-2.10.1.tar.gz"
            )
            with open(ft, 'w') as f:
                f.write(c)
            print("✅ Patched freetype URL")

        # ═══════════════════════════════════════════════
        # 2. REPORTLAB: تعديل URL + تعطيل patches
        # ═══════════════════════════════════════════════
        rl = f"{P4A}/pythonforandroid/recipes/reportlab/__init__.py"
        if os.path.exists(rl):
            with open(rl) as f:
                c = f.read()
            
            # تعديل URL
            c = c.replace(
                "https://hg.reportlab.com/hg-public/reportlab/archive/{version}.tar.gz",
                "https://files.pythonhosted.org/packages/source/r/reportlab/reportlab-3.6.13.tar.gz"
            )
            
            # تعطيل patches (بأي شكل)
            c = re.sub(r"patches\s*=\s*\[[^\]]*\]", "patches = []", c, flags=re.DOTALL)
            
            with open(rl, 'w') as f:
                f.write(c)
            print("✅ Patched reportlab URL and disabled patches")
            
            # إظهار النتيجة
            print("\n--- reportlab recipe (relevant lines) ---")
            for line in c.split('\n'):
                if 'url' in line.lower() or 'patches' in line.lower() or 'version' in line.lower():
                    print(f"  {line.strip()}")
        
        # ═══════════════════════════════════════════════
        # 3. حذف ملفات patch القديمة (احتياط)
        # ═══════════════════════════════════════════════
        patches_dir = f"{P4A}/pythonforandroid/recipes/reportlab/patches"
        if os.path.exists(patches_dir):
            for f in os.listdir(patches_dir):
                os.remove(os.path.join(patches_dir, f))
            print(f"✅ Deleted reportlab patch files")
        PYEOF
    
    - name: Verify patches
      run: |
        echo "═══════ FREETYPE URL ═══════"
        grep -n "url = " .buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py | head -3
        echo ""
        echo "═══════ REPORTLAB URL & PATCHES ═══════"
        grep -nE "url = |patches = " .buildozer/android/platform/python-for-android/pythonforandroid/recipes/reportlab/__init__.py | head -5
    
    - name: Build APK with Buildozer
      run: |
        export USE_CCACHE=1
        buildozer -v android debug
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: samir-pyth-dz-apk
        path: bin/*.apk
        retention-days: 30
