name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # خطوة اختيارية: إذا كنت تستخدم Python في مشروعك
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # خطوة اختيارية: إذا كنت تستخدم ccache لتسريع البناء
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ github.job }}-${{ runner.os }}

    # ⚠️ تنبيه: إذا كان مشروعك في مجلد فرعي، غير المسار إلى ./android/gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    # ⚠️ تنبيه: إذا كان مشروعك في مجلد فرعي، غير الأمر إلى ./android/gradlew assembleDebug
    - name: Build with Gradle
      run: ./gradlew assembleDebug
